<style>
*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
:root{--bg:#050505;--surface:#0d0d0d;--card:rgba(255,255,255,.06);--on:#ececec;--on2:rgba(200,200,200,.62);--primary:#b3202b;--on-primary:#fff;--acc2:#ffb020;--red:#ec3b46;--tonal:rgba(255,255,255,.09);--tertiary:#ff6f78;--line:rgba(255,255,255,.08);--chip:rgba(255,255,255,.07);--shell:#08060c;--shadow:rgba(0,0,0,.25)}

html,body{height:100%}
body{font:400 14px/20px 'Bricolage Grotesque',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--shell);color:var(--on);display:flex;align-items:center;justify-content:center;gap:28px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{filter:brightness(1.3)}input:focus-visible{outline:none}
#phone{position:relative;width:392px;height:min(820px,96vh);background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1a1628;display:flex;flex-direction:column;isolation:isolate}
#status{height:32px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:500}
#nav{height:22px;flex:none;display:flex;justify-content:center;align-items:center}#nav i{width:110px;height:4px;border-radius:2px;background:var(--on2);opacity:.5}
#stack{position:relative;flex:1;overflow:hidden}
.scr{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.scr.pop{animation:out .18s ease-in forwards}@keyframes out{to{transform:translateX(40px);opacity:0}}

.bar{height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 4px}
.bar h1{font-size:22px;line-height:28px;font-weight:500;padding-left:12px}.bar .ib+h1{padding-left:4px}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.ib:active{background:var(--chip)}
.body{flex:1;overflow:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
svg.i{width:24px;height:24px;fill:currentColor;color:var(--red);flex:none}
.ieb svg.i{color:#000!important}

.sub{color:var(--on2)}.small{font-size:12px;line-height:16px;color:var(--on2)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);font-weight:500}

.dur{display:flex;flex-direction:column;gap:12px;width:100%}.dur .row{display:flex;justify-content:space-between;align-items:center}

input[type=text]:focus{outline:none}
.li{display:flex;align-items:center;gap:16px;padding:10px 16px;width:100%;text-align:left}.li:disabled{opacity:.5;cursor:default}.li:not(:disabled):active{background:var(--chip)}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.stat .card{display:block}
.chart{display:flex;align-items:flex-end;gap:0;height:140px;margin-top:8px}.chart div{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%}.chart b{width:60%;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s}
.lbls{display:flex}.lbls span{flex:1;text-align:center}
.rowb{display:flex;justify-content:space-between;width:100%;font-size:16px;line-height:24px}

.scrim{position:absolute;inset:0;background:#0007;display:grid;place-items:center;padding:28px;z-index:20}
.dlg{background:var(--surface);border-radius:28px;padding:24px;width:100%;display:flex;flex-direction:column;gap:16px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}.dlg .acts button{padding:10px 12px;border-radius:20px;color:var(--primary);font-weight:500}
.ovl{position:absolute;inset:0;z-index:25;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px}
.ovl .big{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,var(--tertiary) 18%,transparent);color:var(--tertiary);display:grid;place-items:center;margin-bottom:12px}.ovl .big svg{width:48px;height:48px}
#demo{width:230px;display:flex;flex-direction:column;gap:8px;font-size:13px}
#demo h2{font-size:15px;font-weight:600}#demo button{background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
#demo p{color:var(--on2);font-size:12px;line-height:16px}
#demoToggle{display:none}
@media (max-width:640px){body{display:block}#phone{width:100%;height:100%;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#status,#nav{display:none}
#demo{display:none;position:fixed;top:8px;right:8px;z-index:50;background:var(--surface);padding:14px;border-radius:14px;box-shadow:0 8px 30px #0005}#demo.open{display:flex}
#demoToggle{display:grid;position:fixed;right:8px;bottom:8px;z-index:51;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);place-items:center;font-size:12px;font-weight:700}}
@media (min-width:641px) and (max-width:860px){#demo{display:none}}

html.native #phone{width:100%;height:100%;border-radius:0;box-shadow:none}

.seg button[aria-pressed=true]{background:var(--surface);color:var(--on)}
.cust,.timebox{display:flex;gap:8px;align-items:center}
.cust .search,.timebox .search{flex:1;height:48px}
.cust .btn{height:48px}
.timebox .seg{width:128px;flex:none;min-width:0}
.cust .search,.timebox .search{min-width:0}.cust .search input{min-width:0;width:100%}.cust .btn{flex:none}.timebox .search input{min-width:0;width:100%}.timebox .seg button{min-width:0;padding:0}
.seg.n3{grid-template-columns:repeat(3,1fr)}.seg.n3 button{font-size:13px;padding:0 2px;white-space:nowrap;min-width:0}
.sugs{display:flex;flex-direction:column;gap:4px;width:100%}
.sg{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--card);text-align:left;width:100%}
.sg .tile{width:32px;height:32px;border-radius:10px}.sg svg.i{width:18px;height:18px}
.sg b{color:var(--acc2);font-weight:700}
.bar:not(:has(.ib)) h1{letter-spacing:.2em;font-weight:800}

 const c=e.target.closest(".chart>div,.lbls>span");if(c&&stack.at(-1).name==="stats"){const i=[...c.parentNode.children].indexOf(c),t=stack.at(-1).st;t.day=t.day===i?null:i;dayDet(t,1);return}

   const go1=()=>{if(lim){Native.startAllowance(top.arg,ms);stack=stack.slice(0,1);mount(true);toast(`${n}: ${fmtDur(ms)} allowed today`);return}Native.startBlock(top.arg,ms);stack=stack.slice(0,1);mount(true);toast(`${n} locked for ${fmtDur(ms)}`)};
   if(S.confirm)dialog(lim?"Start daily limit?":"Start lock?",lim?`${esc(n)} will be allowed for ${fmtDur(ms)} today, then locked until midnight.`:`${esc(n)} will be locked for ${fmtDur(ms)}. You can't end it early.`,"Start",go1,"lock");else go1()}
  else if(a==="adddom"){const lim=st.mode==="limit",add=()=>{if(lim){Native.addDomainAllowance(st.input,lockMs(st));toast("Daily limit set")}else{Native.addDomain(st.input,lockMs(st));toast("Domain blocked")}st.input="";st.add=0;st.edited=0;st.mode="limit";st.minutes=S.defLim||30;paint()};
   if(!Native.permGranted("vpn"))dialog("Turn on website blocking","App Blocker filters blocked sites on this device with a local DNS filter, so they stay blocked in every browser. Nothing leaves your device.","Turn on",()=>{add();Native.grant("vpn")},"lang");else add()}
  else if(a==="rmdom"){Native.removeDomain(v);paint()}

    else if(a==="theme"){S.theme=v;save();applyTheme();paint()}
    else if(a==="defmin"){S.defMin=+v;save();paint()}
    else if(a==="deflim"){S.defLim=+v;save();paint()}
        else if(a==="custtog"){st.cu=st.cu===v?"":v;paint()}
            else if(a==="defcust"){const inp=$("#c_"+v),n=parseDur(inp?inp.value:"");if(!n){toast("Type a time like 1h 30m or 90");return}if(v==="defmin")S.defMin=clampN(n,5,10080,60);else S.defLim=clampN(n,5,1440,30);st.cu="";save();paint();toast("Default saved")}

    else if(a==="lspick"){lsPick()}

  return}

function lsLoad(f){if(!f)return;var rd=new FileReader();rd.onerror=()=>toast("Could not read that image");rd.onload=()=>{var im=new Image();im.onerror=()=>toast("That file is not a usable image");im.onload=()=>{try{var r=$("#phone").getBoundingClientRect(),ar=r.width&&r.height?r.width/r.height:9/19,W=540,H=Math.round(W/ar),c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d"),sw=im.width,sh=sw/ar;if(sh>im.height){sh=im.height;sw=sh*ar}x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);S.lsImg=c.toDataURL("image/jpeg",.82);S.lsOn=1;try{save()}catch(_){toast("Image is too large to save")}paint()}catch(_){toast("Could not process image")}};im.src=rd.result};rd.readAsDataURL(f)}
function lsCard(nm,ico,tm,ov,pv){var im=S.lsImg;return `<div class="lscard${pv?" pv":""}"><div class="lsimg${im?"":" none"}"${im?` style="background-image:url('${im}')"`:""}>${im?"":`<div class="lsnone">No image yet</div>`}</div><div class="lsrow">${ico}<div><div class="lsname">${nm}</div><div class="lstime"${ov?" data-ov":""}>${tm}</div></div></div></div>`}
function lsPhone(nm,ico,tm){return `<div class="lsphone">${lsCard(nm,ico,tm,0,1)}<div class="lsmini">Go to home screen</div></div>`}
function lsIco(label,isDomain){var a=isDomain?null:Native.lockedApps().find(x=>x.label===label);return a?icoHtml(a):`<span class="tile">${ic(isDomain?"lang":"lock")}</span>`}
var lsLast=null,lsRaw=null,lsC={z:1,x:0,y:0,fw:0,fh:0,s:1};
function lsOpen(f){if(!f||f===lsLast)return;lsLast=f;setTimeout(()=>{lsLast=null},1500);var rd=new FileReader();rd.onerror=()=>toast("Could not read that image");rd.onload=()=>{var im=new Image();im.onerror=()=>toast("That file is not a usable image");im.onload=()=>{lsRaw=im;lsCropUI()};im.src=rd.result};rd.readAsDataURL(f)}
function lsCropDraw(){var im=lsRaw,b=Math.max(lsC.fw/im.width,lsC.fh/im.height),s=b*lsC.z,w=im.width*s,h=im.height*s,mx=(w-lsC.fw)/2,my=(h-lsC.fh)/2;lsC.x=Math.max(-mx,Math.min(mx,lsC.x));lsC.y=Math.max(-my,Math.min(my,lsC.y));lsC.s=s;var e=$("#cropi");e.style.width=w+"px";e.style.height=h+"px";e.style.left=(lsC.fw/2-w/2+lsC.x)+"px";e.style.top=(lsC.fh/2-h/2+lsC.y)+"px"}
function lsCropUI(){$(".lscrop")?.remove();var o=document.createElement("div");o.className="lscrop";o.innerHTML=`<div class="t-lg">Adjust image</div><div class="small">Drag to move, slide to zoom</div><div class="cropf" id="cropf"><img id="cropi" alt="" draggable="false"></div><input type="range" id="cropz" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><div class="cropb"><button class="tonal" data-c="cancel">Cancel</button><button class="btn" data-c="save">Save</button></div>`;$("#phone").append(o);$("#cropi",o).src=lsRaw.src;var f=$("#cropf",o),k=f.getBoundingClientRect().width/f.offsetWidth||1,d=null;lsC.z=1;lsC.x=0;lsC.y=0;lsC.fw=f.offsetWidth;lsC.fh=f.offsetHeight;lsCropDraw();
 f.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,ox:lsC.x,oy:lsC.y};try{f.setPointerCapture(e.pointerId)}catch(_){}};
 f.onpointermove=e=>{if(!d)return;lsC.x=d.ox+(e.clientX-d.x)/k;lsC.y=d.oy+(e.clientY-d.y)/k;lsCropDraw()};
 f.onpointerup=f.onpointercancel=()=>{d=null};
 $("#cropz",o).oninput=e=>{lsC.z=+e.target.value;lsCropDraw()};
 o.onclick=e=>{var c=e.target.dataset.c;if(c==="cancel"){lsRaw=null;o.remove()}else if(c==="save")lsCropSave(o)}}
function lsCropSave(o){try{var im=lsRaw,s=lsC.s,W=480,H=Math.round(W*lsC.fh/lsC.fw),c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d"),sw=lsC.fw/s,sh=lsC.fh/s,sx=(im.width*s/2-lsC.fw/2-lsC.x)/s,sy=(im.height*s/2-lsC.fh/2-lsC.y)/s;x.drawImage(im,sx,sy,sw,sh,0,0,W,H);S.lsImg=c.toDataURL("image/jpeg",.85);S.lsOn=1;try{save()}catch(_){toast("Image is too large to save")}o.remove();lsRaw=null;paint()}catch(_){toast("Could not process image")}}
/* ===== config export / import ===== */
function cfgBuild(withLocks){const t=now(),o={app:"app-blocker",version:1,exportedAt:new Date().toISOString(),settings:prefsOut()};
 if(withLocks)o.locks={apps:Native.lockedApps().map(a=>a.allow?{pkg:a.pkg,label:a.label,type:"limit",allowMs:a.allow}:{pkg:a.pkg,label:a.label,type:"duration",remainingMs:Math.max(0,a.until-t)}),
  domains:Native.domains().filter(d=>d.until>t).map(d=>d.allow?{domain:d.domain,type:"limit",allowMs:d.allow,usedMs:d.used||0}:{domain:d.domain,type:"duration",remainingMs:d.until-t})};
 return o}
function cfgExport(withLocks){const txt=JSON.stringify(cfgBuild(withLocks),null,2),d=new Date(),nm="app-blocker-config-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
 if(IS_NATIVE){try{B.exportFile(nm,txt)}catch(e){toast("Could not export")}return}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Config exported")}catch(e){toast("Could not export")}}
const clampN=(v,lo,hi,d)=>{v=+v;return isFinite(v)?Math.min(hi,Math.max(lo,Math.round(v))):d};
function cfgApply(c){const st=c.settings||{},ch=[];
 if("lsOn"in st)S.lsOn=st.lsOn?1:0;
 if(typeof st.lsImg==="string"&&(st.lsImg===""||(/^data:image\/(jpeg|png|webp);base64,/.test(st.lsImg)&&st.lsImg.length<3e6)))S.lsImg=st.lsImg;
 if(["system","light","dark"].includes(st.theme))S.theme=st.theme;
 if("defMin"in st)S.defMin=clampN(st.defMin,5,10080,60);
 if("defLim"in st)S.defLim=clampN(st.defLim,5,1440,30);
 if(typeof st.msg==="string")S.msg=st.msg.slice(0,140);
 if("confirm"in st)S.confirm=st.confirm?1:0;
 save();applyTheme();
 let na=0,nd=0;const L=c.locks||{},have=new Set(Native.lockedApps().map(a=>a.pkg)),haveD=new Set(Native.domains().filter(d=>d.until>now()).map(d=>d.domain));
 (Array.isArray(L.apps)?L.apps:[]).forEach(a=>{if(!a||typeof a.pkg!=="string"||!/^[A-Za-z0-9._]+$/.test(a.pkg)||have.has(a.pkg))return;
  if(a.type==="limit"){const m=clampN(a.allowMs,MIN,1440*MIN,0);if(m){Native.startAllowance(a.pkg,m);na++}}
  else{const m=clampN(a.remainingMs,0,7*1440*MIN,0);if(m>=1000){Native.startBlock(a.pkg,m);na++}}});
 (Array.isArray(L.domains)?L.domains:[]).forEach(d=>{if(!d||typeof d.domain!=="string")return;const dm=normDom(d.domain);if(!dm||haveD.has(dm))return;if(d.type==="limit"){const m=clampN(d.allowMs,MIN,1440*MIN,0);if(m){Native.addDomainAllowance(dm,m);nd++}return}const m=clampN(d.remainingMs,0,7*1440*MIN,0);if(m>=1000){Native.addDomain(dm,m);nd++}});
 if(nd&&!Native.permGranted("vpn"))Native.grant("vpn");
 paint();toast("Imported"+(na||nd?`: ${na} app and ${nd} website lock${na+nd===1?"":"s"} started`:" settings"))}
function cfgRead(f){if(!f)return;const rd=new FileReader();rd.onerror=()=>toast("Could not read that file");
 rd.onload=()=>{let c=null;try{c=JSON.parse(rd.result)}catch(e){}
  if(!c||c.app!=="app-blocker"||typeof c.settings!=="object"||!c.settings){toast("That is not an App Blocker config");return}
  const L=c.locks||{},n=(Array.isArray(L.apps)?L.apps.length:0)+(Array.isArray(L.domains)?L.domains.length:0);
  dialog("Import this config?",`This replaces your current settings${n?` and starts ${n} lock${n===1?"":"s"} from the file`:""}. Locks that are already running are kept as they are.`,"Import",()=>cfgApply(c),"down")};
 rd.readAsText(f)}

function demo(k){
 if(k==="theme"){const dark=document.documentElement.dataset.theme==="light";S.dark=dark?"dark":"light";document.documentElement.dataset.theme=S.dark;save()}
 else if(k==="ff"){S.off+=10;save();paint();toast("Fast-forwarded 10 minutes")}
 else if(k==="dns"){S.strictDns=S.strictDns?0:1;save();paint()}
 else if(k==="overlay-app"){const a=Native.lockedApps()[0];a?overlay(a.label,a.until,false):toast("Lock an app first, then try again")}
 else if(k==="overlay-web"){const d=Native.domains().find(x=>x.until>now());d?overlay(d.domain,d.until,true):toast("Block a website first, then try again")}
 else if(k==="first"){PERMS.forEach(p=>S.perms[p.id]=0);S.owner=0;save();firstRun=true;stack=[{name:"perms",st:{}}];mount(true)}
 else if(k==="reset"){const th=S.dark;S=fresh();S.dark=th;save();firstRun=false;stack=[{name:"home",st:{}}];mount(true)}
 $("#demo").classList.remove("open")}
