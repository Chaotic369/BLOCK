<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;600;700&display=swap" rel="stylesheet">
<title>App Blocker – UI demo</title>
<style>
:root{--bg:#050505;--surface:#0d0d0d;--card:rgba(255,255,255,.06);--on:#ececec;--on2:rgba(200,200,200,.62);--primary:#b3202b;--on-primary:#fff;--acc2:#ffb020;--red:#ec3b46;--tonal:rgba(255,255,255,.09);--tertiary:#ff6f78;--line:rgba(255,255,255,.08);--chip:rgba(255,255,255,.07);--shell:#08060c;--shadow:rgba(0,0,0,.25)}
:root[data-theme="light"]{--bg:#f6f3f4;--surface:#fff;--card:#fff;--on:#1a1416;--on2:#6b6165;--primary:#b3202b;--on-primary:#fff;--acc2:#fcae00;--red:#c4161f;--tonal:rgba(0,0,0,.06);--tertiary:#b3202b;--line:rgba(0,0,0,.09);--chip:rgba(0,0,0,.05);--shell:#e8e4e6;--shadow:rgba(0,0,0,.06)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:400 14px/20px 'Bricolage Grotesque',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--shell);color:var(--on);display:flex;align-items:center;justify-content:center;gap:28px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{filter:brightness(1.3)}input:focus-visible{outline:none}
#phone{position:relative;width:392px;height:min(820px,96vh);background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1a1628;display:flex;flex-direction:column;isolation:isolate}
#status{height:32px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:500}
#nav{height:22px;flex:none;display:flex;justify-content:center;align-items:center}#nav i{width:110px;height:4px;border-radius:2px;background:var(--on2);opacity:.5}
#stack{position:relative;flex:1;overflow:hidden}
.scr{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.scr.pop{animation:out .18s ease-in forwards}@keyframes out{to{transform:translateX(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.scr,.scr.pop{animation:none}}
.bar{height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 4px}
.bar h1{font-size:22px;line-height:28px;font-weight:500;padding-left:12px}.bar .ib+h1{padding-left:4px}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.ib:active{background:var(--chip)}
.body{flex:1;overflow:auto;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
svg.i{width:24px;height:24px;fill:currentColor;color:var(--red);flex:none}
.card{background:var(--card);border-radius:12px;padding:16px;display:flex;align-items:center;gap:16px;width:100%;text-align:left}
button.card:active{filter:brightness(.96)}
.card .grow{flex:1;min-width:0}
.t-md{font-size:16px;line-height:24px;font-weight:500}.t-lg{font-size:22px;line-height:28px;font-weight:600}.t-hd{font-size:28px;line-height:34px;font-weight:700}
.sub{color:var(--on2)}.small{font-size:12px;line-height:16px;color:var(--on2)}
.pri{color:var(--primary);font-weight:500}.err{color:var(--tertiary)}
.btn{background:var(--primary);color:var(--on-primary);height:40px;padding:0 24px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.38;cursor:default}.btn.full{width:100%}
.tonal{background:var(--tonal);color:var(--on);height:40px;padding:0 20px;border-radius:20px;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);font-weight:500}
.chip[aria-pressed=true]{background:var(--tonal);border-color:transparent}
.dur{display:flex;flex-direction:column;gap:12px;width:100%}.dur .row{display:flex;justify-content:space-between;align-items:center}
input[type=text]{width:100%;height:56px;border-radius:4px;border:0;background:transparent;color:var(--on);padding:0 16px;font:inherit;font-size:16px}
input[type=text]:focus{outline:none}
.li{display:flex;align-items:center;gap:16px;padding:10px 16px;width:100%;text-align:left}.li:disabled{opacity:.5;cursor:default}.li:not(:disabled):active{background:var(--chip)}
.ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.stat .card{display:block}
.chart{display:flex;align-items:flex-end;gap:0;height:140px;margin-top:8px}.chart div{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%}.chart b{width:60%;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s}
.lbls{display:flex}.lbls span{flex:1;text-align:center}
.rowb{display:flex;justify-content:space-between;width:100%;font-size:16px;line-height:24px}
.code{font:12px/16px ui-monospace,Menlo,monospace;background:var(--surface);padding:10px;border-radius:8px;word-break:break-all;margin-top:8px;user-select:all}
#toast{position:absolute;left:16px;right:16px;bottom:16px;background:#2e3040;color:#fff;padding:14px 16px;border-radius:6px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;z-index:30}#toast.on{opacity:1;transform:none}
.scrim{position:absolute;inset:0;background:#0007;display:grid;place-items:center;padding:28px;z-index:20}
.dlg{background:var(--surface);border-radius:28px;padding:24px;width:100%;display:flex;flex-direction:column;gap:16px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}.dlg .acts button{padding:10px 12px;border-radius:20px;color:var(--primary);font-weight:500}
.ovl{position:absolute;inset:0;z-index:25;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:8px}
.ovl .big{width:88px;height:88px;border-radius:50%;background:color-mix(in srgb,var(--tertiary) 18%,transparent);color:var(--tertiary);display:grid;place-items:center;margin-bottom:12px}.ovl .big svg{width:48px;height:48px}
#demo{width:230px;display:flex;flex-direction:column;gap:8px;font-size:13px}
#demo h2{font-size:15px;font-weight:600}#demo button{background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left}
#demo p{color:var(--on2);font-size:12px;line-height:16px}
#demoToggle{display:none}
@media (max-width:640px){body{display:block}#phone{width:100%;height:100%;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#status,#nav{display:none}
#demo{display:none;position:fixed;top:8px;right:8px;z-index:50;background:var(--surface);padding:14px;border-radius:14px;box-shadow:0 8px 30px #0005}#demo.open{display:flex}
#demoToggle{display:grid;position:fixed;right:8px;bottom:8px;z-index:51;width:40px;height:40px;border-radius:50%;background:var(--primary);color:var(--on-primary);place-items:center;font-size:12px;font-weight:700}}
@media (min-width:641px) and (max-width:860px){#demo{display:none}}
/* ===== native redesign (matches Quick Launcher look) ===== */
#nav i{width:120px;height:4.5px;border-radius:4px;background:var(--on);opacity:.75}

.bar{height:72px;padding:0 16px 0 12px;gap:12px}
.bar h1{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.3px;padding-left:0}
.ib{width:40px;height:40px;border-radius:14px}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--red)}
.tile.big{width:56px;height:56px;border-radius:18px}.tile.big svg.i{width:28px;height:28px}
.tile.ok{color:var(--acc2)}
.hdic{display:grid;place-items:center;flex:none;color:var(--acc2);margin-left:8px}
.hdic svg.i{width:30px;height:30px;color:inherit}
.hdic.on{color:var(--acc2)}
.sw{width:52px;height:30px;border-radius:15px;background:var(--chip);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--on2);transition:transform .2s,background .2s}
.sw.on{background:var(--acc2)}
.sw.on i{transform:translateX(22px);background:#2a1800}
.ovl.ls{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;padding:36px 16px 20px;text-align:left}
.lsimg{position:relative;flex:1;min-height:0;border-radius:28px;background-color:var(--chip);background-size:cover;background-position:center;overflow:hidden;display:flex;align-items:flex-end}
.lsimg:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),transparent 55%)}
.lsinfo{position:relative;z-index:1;padding:20px;color:#fff;display:flex;flex-direction:column;gap:4px}
.lsname{font-size:18px;line-height:24px;font-weight:700}
.lstime{font-size:22px;line-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.lsimg.pv{flex:none;width:54%;align-self:center;border-radius:24px}
.pv .lsinfo{padding:14px}
.pv .lsname{font-size:12px;line-height:16px}
.pv .lstime{font-size:14px;line-height:18px}
.lsimg.none:after{display:none}
.lsimg.none .lsinfo{color:var(--on)}
.lsnone{position:absolute;inset:0;display:grid;place-items:center;color:var(--on2);font-size:13px}
.ovl.ls{align-items:center;justify-content:center;gap:20px;padding:24px 16px}
.ovl.ls .btn{width:72%}
.lscard{width:72%;display:flex;flex-direction:column;gap:14px}
.lscard .lsimg{flex:none;width:100%;aspect-ratio:3/4;min-height:0;border-radius:28px}
.lscard .lsimg:after{display:none}
.lsrow{display:flex;align-items:center;gap:12px;text-align:left}
.lscard .lsname{font-size:18px;line-height:24px;font-weight:700;color:var(--on)}
.lscard .lstime{font-size:15px;line-height:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc2)}
.lscard.pv{width:58%;align-self:center;gap:10px}
.lscard.pv .lsimg{border-radius:22px}
.lscard.pv .lsrow{gap:8px}
.lscard.pv .ico,.lscard.pv .tile{width:32px;height:32px;border-radius:10px;font-size:14px}
.lscard.pv .lsname{font-size:14px;line-height:18px}
.lscard.pv .lstime{font-size:12px;line-height:16px}
.lscrop{position:absolute;inset:0;z-index:70;background:var(--bg,var(--card));display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 20px 20px}
.cropf{position:relative;width:70%;aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:var(--chip);touch-action:none;cursor:grab;flex:none}
.cropf img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
#cropz{width:70%;accent-color:var(--acc2)}
.cropb{display:flex;gap:12px;width:100%;margin-top:auto}
.cropb button{flex:1}
.tile.brand{width:36px;height:36px;border-radius:12px;background:var(--acc2)}.tile.brand svg.i{color:#2a1800}
.card{background:var(--card);border-radius:20px}
.card.navc{padding:14px 16px}.chev{color:var(--on2);display:grid}
.hero{display:flex;gap:16px;align-items:center;padding:18px;border-radius:24px;background:var(--card)}
.hero.on{background:rgba(255,176,32,.14)}

.t-lg{font-size:18px;line-height:24px;font-weight:700}
.stat .t-lg{font-size:26px;line-height:30px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc2)}
.empty{padding:18px;border-radius:20px;background:var(--card);color:var(--on2);text-align:center}
.pri,.err{color:var(--acc2)}
.btn{flex:none;background:var(--primary);height:48px;border-radius:16px;font-weight:700}
.btn.sm{height:36px;padding:0 18px;border-radius:12px;box-shadow:none}
.tonal{background:var(--tonal);height:48px;border-radius:16px;font-weight:600}.tonal.full{width:100%}
.chip{height:36px;border-radius:12px;background:var(--chip);border:0;color:var(--on2)}
.chip[aria-pressed=true]{background:var(--acc2);color:#2a1800}
.dur{background:var(--card);border-radius:20px;padding:16px}
.stepper{align-items:center;gap:12px}
.dv{flex:1;text-align:center;display:flex;flex-direction:column}
.dv .big{font-size:40px;line-height:44px;font-weight:700;letter-spacing:-1px}
.rnd{width:52px;height:52px;border-radius:18px;background:var(--chip);display:grid;place-items:center;flex:none}
.rnd:active{background:var(--primary);color:#fff}.rnd:active svg.i{color:#fff}
.search{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-radius:16px;background:var(--chip);color:var(--on2);width:100%}
.search:focus-within{background:var(--tonal);color:var(--on)}
.search input[type=text]{height:100%;border:0;background:none;padding:0;font-size:15px;border-radius:0;color:var(--on)}
.search input[type=text]:focus{border:0;padding:0}
.st-hero{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:20px;border-radius:24px;background:var(--card)}
.st-big{font-size:44px;line-height:48px;font-weight:700;letter-spacing:-1px;color:var(--acc2)}
.st-ins{font-size:15px;line-height:22px;margin-top:6px}
.st-sec{flex-direction:column;align-items:stretch;gap:12px}
.stat .card{padding:14px 16px}
.search input[type=text]{flex:1;min-width:0;width:auto;text-overflow:ellipsis}
.search input::placeholder{color:var(--on2);opacity:.7}
.search:focus-within{box-shadow:inset 0 0 0 2px var(--acc2)}
.search svg.i{color:var(--on2)}
.search:focus-within svg.i{color:var(--acc2)}
.ico{border-radius:14px}
.ico.lg{width:56px;height:56px;border-radius:18px;font-size:24px}
.li{padding:10px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.pill svg.i{width:16px;height:16px}
.pill.ok{color:var(--acc2)}
.pill.lock{background:rgba(255,176,32,.14);color:var(--acc2)}
.opt{font-size:11px;font-weight:600;color:var(--on2);background:var(--chip);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
.perm{align-items:flex-start}.perm .btn,.perm .pill{align-self:center}
.tgt{display:flex;align-items:center;gap:16px}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--chip);color:var(--on2)}
.note svg.i{margin-top:1px}
.note.warn{background:rgba(255,176,32,.14);color:var(--acc2)}
.sum{text-align:center;color:var(--on2)}.sum b{color:var(--on);font-size:18px}
.chart{height:150px}
.chart b{background:var(--chip);border-radius:8px}.chart b.today{background:var(--acc2)}
.chart>div,.lbls>span{cursor:pointer}
.chart>div.sel b{outline:2px solid var(--on);outline-offset:1px}
.lbls>span.sel{color:var(--acc2);font-weight:700}
.dayd{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.rowm{width:100%}
.rowm .rl{display:flex;justify-content:space-between;font-size:15px;line-height:22px;margin-bottom:6px}
.meter{display:block;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.meter u{display:block;height:100%;background:var(--acc2);border-radius:3px;text-decoration:none}
#toast{background:var(--surface);color:var(--on);border-radius:16px}
.scrim{place-items:end stretch;padding:0;background:rgba(0,0,0,.6);animation:fade .18s}
.dlg{border-radius:28px 28px 0 0;padding:14px 22px 26px;background:var(--surface);gap:12px;align-items:flex-start;animation:up .24s cubic-bezier(.16,1,.3,1)}

.dlg .acts{flex-direction:column;width:100%;gap:8px;margin-top:8px}
.dlg .acts button{padding:0 20px;border-radius:16px}
.dlg .acts .btn{color:var(--on-primary)}.dlg .acts .tonal{color:var(--on)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.scrim,.dlg{animation:none}}

.ovl .big{width:104px;height:104px;background:var(--chip);color:var(--red);margin-bottom:28px}
.foot{flex:none;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.dur [hidden]{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--chip)}
.seg button{height:36px;border-radius:12px;font-weight:600;color:var(--on2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--on)}
.cust,.timebox{display:flex;gap:8px;align-items:center}
.cust .search,.timebox .search{flex:1;height:48px}
.cust .btn{height:48px}
.timebox .seg{width:120px;flex:none}
.sugs{display:flex;flex-direction:column;gap:4px;width:100%}
.sg{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--card);text-align:left;width:100%}
.sg .tile{width:32px;height:32px;border-radius:10px}.sg svg.i{width:18px;height:18px}
.sg b{color:var(--acc2);font-weight:700}
.bar:not(:has(.ib)) h1{letter-spacing:.2em;font-weight:800}
</style>
</head>
<body>
<div id="phone">
  <div id="status"><span id="clock">9:41</span><span>5G ▮▮▮ 86%</span></div>
  <div id="stack"></div>
  <div id="nav"><i></i></div>
  <div id="toast"></div>
</div>
<aside id="demo">
  <h2>Demo controls</h2>
  <p>Only for this preview; they won’t exist in the real app.</p>
  <button data-d="overlay-app">Open a locked app (block screen)</button>
  <button data-d="overlay-web">Open a locked website</button>
  <button data-d="ff">Fast-forward 10 min</button>
  <button data-d="theme">Toggle dark mode</button>
  <button data-d="dns">Toggle strict Private DNS</button>
  <button data-d="first">Restart as first run</button>
  <button data-d="reset">Reset all data</button>
</aside>
<button id="demoToggle" aria-label="Demo controls">demo</button>

<script>
/* ============ NATIVE BRIDGE ============
   Everything the UI needs from the device goes through `Native`.
   In the real WebView app, replace each method body with the matching
   Android JS interface call (e.g. JSON.parse(Android.listApps())) and
   call render() from the native side when data changes (window.onNativeEvent). */
const MIN=60000, APPS=[
["Instagram","com.instagram.android","#d6249f"],["YouTube","com.google.android.youtube","#e62117"],["Chrome","com.android.chrome","#4285f4"],
["WhatsApp","com.whatsapp","#1fa855"],["TikTok","com.zhiliaoapp.musically","#161823"],["X","com.twitter.android","#14171a"],
["Reddit","com.reddit.frontpage","#ff4500"],["Netflix","com.netflix.mediaclient","#b20710"],["Spotify","com.spotify.music","#1db954"],
["Snapchat","com.snapchat.android","#e6c800"],["Facebook","com.facebook.katana","#1877f2"],["Gmail","com.google.android.gm","#d93025"],
["Telegram","org.telegram.messenger","#2a9fd8"],["Discord","com.discord","#5865f2"],["Twitch","tv.twitch.android.app","#9146ff"],
["Pinterest","com.pinterest","#e60023"],["Maps","com.google.android.apps.maps","#188038"],["Play Store","com.android.vending","#0f9d58"]];
const PERMS=[
{id:"usage",t:"Usage access",d:"Lets the app read screen time and detect which app is open.",req:1,sys:"Usage access"},
{id:"a11y",t:"Accessibility service",d:"Detects blocked apps and websites as they open and shows the block screen.",req:1,sys:"Accessibility"},
{id:"overlay",t:"Display over other apps",d:"Required to show the block screen on top of a blocked app.",req:1,sys:"Display over other apps"},
{id:"admin",t:"Device administrator",d:"Prevents uninstalling the app while a lock is active.",req:1,sys:"Device admin apps"},
{id:"vpn",t:"Website blocking (VPN)",d:"Filters blocked domains in every browser through a local DNS filter. Nothing leaves your device.",req:0,sys:"VPN"},
{id:"notif",t:"Notifications",d:"Warns you if accessibility or device administrator is switched off during a lock.",req:0,sys:"Notifications"}];
const fresh=()=>({off:0,apps:{},domains:[],perms:{usage:1,a11y:1,overlay:1,admin:1,vpn:0,notif:1},owner:0,strictDns:0,dark:null});
let S=fresh();
try{const x=localStorage.getItem("ab-demo");if(x)S=Object.assign(fresh(),JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("ab-demo",JSON.stringify(S))}catch(e){}};
const now=()=>Date.now()+S.off*MIN;
const Native={

 return bar("Permissions",1)+`<div class="body">${P.map(p=>`<div class="card perm"><span class="tile${p.granted?" ok":""}">${ic(PI[p.id])}</span><div class="grow"><div class="t-md">${p.t}${p.req?"":` <span class="opt">Optional</span>`}</div><div class="sub">${p.d}</div></div>${p.granted?`<span class="pill ok">${ic("check")}Granted</span>`:`<button class="btn sm" data-a="grant" data-v="${p.id}">Allow</button>`}</div>`).join("")}
 <div class="card" style="display:block"><div class="t-md">Stronger uninstall protection</div>${S.owner?`<div class="sub">This app is a device owner, so Android itself blocks uninstalling it while a lock is active.</div><button class="btn" style="margin-top:8px" data-a="release" ${lock?"disabled":""}>${lock?"Locked until the timer ends":"Release device owner"}</button>`:
 `<div class="sub">Device administrator can be bypassed by turning off accessibility first. For a lock Android enforces itself, run this once from a computer with USB debugging on and no accounts on the phone:</div><div class="code">adb shell dpm set-device-owner com.example.appblocker/.admin.BlockerDeviceAdminReceiver</div><button class="tonal" style="margin-top:10px" data-a="owner">Demo: I ran the command</button>`}</div></div>`}
};
function paint(){const top=stack[stack.length-1],el=$$(".scr",stackEl).pop();if(!el)return mount();
 const q=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
 const sc=$(".body",el)?.scrollTop||0;el.innerHTML=screens[top.name](top.st,top.arg);const b=$(".body",el);if(b)b.scrollTop=sc;
 if(q){const n=document.getElementById(q);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
 $$("[data-h]",el).forEach(b=>requestAnimationFrame(()=>b.style.height=b.dataset.h));
 if(top.name==="stats")dayDet(top.st);
  if(top.name==="perms"&&firstRun)checkFirstRun()}
function dayDet(st,tap){const sc=$$(".scr",stackEl).pop(),ch=sc&&$(".chart",sc);if(!ch)return;const w=ch.parentNode,lb=$(".lbls",w);$$(".dayd",w.parentNode).forEach(e=>e.remove());[...ch.children,...(lb?lb.children:[])].forEach(e=>e.classList.remove("sel"));
 const i=st.day;if(i==null)return;const u=Native.usage(),d=u.daily[i],det=u.det&&u.det[i];
 if(!d||!(d[1]>0)||!det||!det.length){st.day=null;if(tap)toast("No details for this day");return}
 [ch.children[i],lb&&lb.children[i]].forEach(e=>e&&e.classList.add("sel"));
 const mx=Math.max(...det.map(t=>t.ms));
 w.insertAdjacentHTML("afterend",`<div class="dayd"><div class="rowb"><span class="t-md">${i===6?"Today":d[0]}</span><span class="pri" style="font-weight:600">${fmtDur(d[1])}</span></div>${det.map(t=>`<div class="rowm"><div class="rl"><span>${esc(t.label)}</span><span class="pri" style="font-weight:600">${fmtDur(t.ms)}</span></div><i class="meter"><u style="width:${t.ms/mx*100}%"></u></i></div>`).join("")}</div>`)}
function checkFirstRun(){if(PERMS.filter(p=>p.req).every(p=>S.perms[p.id])){firstRun=false;stack=[{name:"home",st:{}}];mount(true);toast("All set. You can start locking apps.")}}
setInterval(()=>{ // per-second tick, like the 1s LaunchedEffect loop
 $$("[data-t]").forEach(e=>{const u=+e.dataset.t;if(u<=now()){if(stack.at(-1).name!=="perms")paint()}else e.textContent=fmtLeft(u)});
 const o=$(".ovl");if(o){const u=+o.dataset.u;if(u<=now())o.remove();else $("[data-ov]",o).textContent="Unlocks in "+fmtLeft(u)}
 const d=new Date();$("#clock").textContent=(d.getHours()%12||12)+":"+String(d.getMinutes()).padStart(2,"0")},1000);

/* ============ dialogs / overlay ============ */
function dialog(title,msg,okText,onOk,icon){const s=document.createElement("div");s.className="scrim";s.innerHTML=`<div class="dlg" role="dialog" aria-label="${esc(title)}"><span class="tile big">${ic(icon||"sec")}</span><div class="t-lg">${title}</div><div class="sub" style="font-size:14px">${msg}</div><div class="acts"><button class="btn full" data-x="ok">${okText}</button><button class="tonal full" data-x="no">Not now</button></div></div>`;
 s.onclick=e=>{const x=e.target.dataset.x;if(x||e.target===s){s.remove();if(x==="ok")onOk()}};$("#phone").append(s)}
function overlay(label,until,isDomain){$(".ovl")?.remove();if(!S.lsOn){stack=[{name:"home",st:{}}];mount(true);toast(label+" is locked");return}const o=document.createElement("div");o.className="ovl"+(S.lsImg?" ls":"");o.dataset.u=until;
 if(S.lsImg){o.innerHTML=`${lsCard(esc(label),lsIco(label,isDomain),"Unlocks in "+fmtLeft(until),1)}<button class="btn full" data-x="home">Go to home screen</button>`;o.onclick=e=>{if(e.target.dataset.x)o.remove()};$("#phone").append(o);return}
 o.innerHTML=`<div class="t-hd" style="letter-spacing:.2em;font-weight:800">BLOCK</div><div class="t-lg" style="margin-top:8px">${esc(label)}</div><div data-ov style="font-size:16px;line-height:24px;padding:16px 0">Unlocks in ${fmtLeft(until)}</div><div class="small" style="margin-bottom:20px">Stay focused. It opens again when the timer ends.</div><button class="btn" data-x="home">Go to home screen</button>`;
 o.onclick=e=>{if(e.target.dataset.x)o.remove()};$("#phone").append(o)}

/* ============ events ============ */
document.addEventListener("click",e=>{
 const c=e.target.closest(".chart>div,.lbls>span");if(c&&stack.at(-1).name==="stats"){const i=[...c.parentNode.children].indexOf(c),t=stack.at(-1).st;t.day=t.day===i?null:i;dayDet(t,1);return}
  const b=e.target.closest("[data-a]");if(b){const a=b.dataset.a,v=b.dataset.v,top=stack.at(-1),st=top.st;
  if(a==="back")back();
  else if(a==="go")go(v);
  else if(a==="pick")go("timer",v);
  else if(a==="preset"){st.mode="dur";st.minutes=+v;paint()}
    else if(a==="mode"){st.mode=v;if(v==="until"&&!st.ut){const t=new Date(now()+36e5);st.ut=((t.getHours()%12)||12)+":"+String(t.getMinutes()).padStart(2,"0");st.ap=t.getHours()>=12?"PM":"AM"}paint()}
    else if(a==="ap"){st.ap=v;paint()}
    else if(a==="setcust"){const n=parseDur(st.cust||"");if(!n){toast("Type a time like 1h 30m or 90");return}st.minutes=Math.min(7*1440,Math.max(5,n));st.cust="";paint()}
    else if(a==="fill"){st.input=v;paint()}
  else if(a==="dec"||a==="inc"){st.minutes=a==="dec"?Math.max(5,st.minutes-5):Math.min(7*1440,st.minutes+5);paint()}
  else if(a==="start"){const ms=lockMs(st);if(!ms)return;Native.startBlock(top.arg,ms);const n=Native.appInfo(top.arg).label;stack=stack.slice(0,1);mount(true);toast(`${n} locked for ${fmtDur(ms)}`)}
  else if(a==="adddom"){const add=()=>{Native.addDomain(st.input,lockMs(st));st.input="";paint();toast("Domain blocked")};
   if(!S.perms.vpn)dialog("Turn on website blocking","App Blocker filters blocked sites on this device with a local DNS filter, so they stay blocked in every browser. Nothing leaves your device.","Turn on",()=>{Native.setPerm("vpn",1);add()},"lang");else add()}
  else if(a==="rmdom"){Native.removeDomain(v);paint()}
  else if(a==="grant"){const p=PERMS.find(x=>x.id===v);dialog(p.t,p.d,"Allow",()=>{Native.setPerm(v,1);paint()},PI[v])}
  else if(a==="owner"){S.owner=1;save();paint()}
    else if(a==="lsOn"){S.lsOn=S.lsOn?0:1;save();paint()}
    else if(a==="lspick"){$("#lsfile")?.click()}
    else if(a==="lsclear"){S.lsImg="";save();paint()}
  else if(a==="release"){S.owner=0;save();paint();toast("Device owner released")}
  return}
 const d=e.target.closest("[data-d]");if(d)demo(d.dataset.d)});
function domRefresh(st){const b=$("#addd");if(b)b.disabled=!(st.input.trim()&&lockMs(st))}
document.addEventListener("input",e=>{const top=stack.at(-1);
 if(e.target.id==="q"){top.st.query=e.target.value;paint()}
 if(e.target.id==="dom"){top.st.input=e.target.value;domRefresh(top.st)}
  if(e.target.id==="ut"){top.st.ut=e.target.value;paint()}
  if(e.target.id==="cust")top.st.cust=e.target.value});
 document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const st=stack.at(-1).st;
  if(e.target.id==="cust")$("[data-a=setcust]")?.click();
  else if(e.target.id==="dom")$("#addd")?.click()});
function lsLoad(f){if(!f)return;var rd=new FileReader();rd.onerror=()=>toast("Could not read that image");rd.onload=()=>{var im=new Image();im.onerror=()=>toast("That file is not a usable image");im.onload=()=>{try{var r=$("#phone").getBoundingClientRect(),ar=r.width&&r.height?r.width/r.height:9/19,W=540,H=Math.round(W/ar),c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d"),sw=im.width,sh=sw/ar;if(sh>im.height){sh=im.height;sw=sh*ar}x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);S.lsImg=c.toDataURL("image/jpeg",.82);S.lsOn=1;try{save()}catch(_){toast("Image is too large to save")}paint()}catch(_){toast("Could not process image")}};im.src=rd.result};rd.readAsDataURL(f)}
function lsCard(nm,ico,tm,ov,pv){var im=S.lsImg;return `<div class="lscard${pv?" pv":""}"><div class="lsimg${im?"":" none"}"${im?` style="background-image:url('${im}')"`:""}>${im?"":`<div class="lsnone">No image yet</div>`}</div><div class="lsrow">${ico}<div><div class="lsname">${nm}</div><div class="lstime"${ov?" data-ov":""}>${tm}</div></div></div></div>`}
function lsIco(label,isDomain){var a=isDomain?null:Native.lockedApps().find(x=>x.label===label);return a?`<span class="ico" style="background:${a.color}">${esc(a.label[0])}</span>`:`<span class="tile">${ic(isDomain?"lang":"lock")}</span>`}
var lsRaw=null,lsC={z:1,x:0,y:0,fw:0,fh:0,s:1};
function lsOpen(f){if(!f)return;var rd=new FileReader();rd.onerror=()=>toast("Could not read that image");rd.onload=()=>{var im=new Image();im.onerror=()=>toast("That file is not a usable image");im.onload=()=>{lsRaw=im;lsCropUI()};im.src=rd.result};rd.readAsDataURL(f)}
function lsCropDraw(){var im=lsRaw,b=Math.max(lsC.fw/im.width,lsC.fh/im.height),s=b*lsC.z,w=im.width*s,h=im.height*s,mx=(w-lsC.fw)/2,my=(h-lsC.fh)/2;lsC.x=Math.max(-mx,Math.min(mx,lsC.x));lsC.y=Math.max(-my,Math.min(my,lsC.y));lsC.s=s;var e=$("#cropi");e.style.width=w+"px";e.style.height=h+"px";e.style.left=(lsC.fw/2-w/2+lsC.x)+"px";e.style.top=(lsC.fh/2-h/2+lsC.y)+"px"}
function lsCropUI(){$(".lscrop")?.remove();var o=document.createElement("div");o.className="lscrop";o.innerHTML=`<div class="t-lg">Adjust image</div><div class="small">Drag to move, slide to zoom</div><div class="cropf" id="cropf"><img id="cropi" alt="" draggable="false"></div><input type="range" id="cropz" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><div class="cropb"><button class="tonal" data-c="cancel">Cancel</button><button class="btn" data-c="save">Save</button></div>`;$("#phone").append(o);$("#cropi",o).src=lsRaw.src;var f=$("#cropf",o),k=f.getBoundingClientRect().width/f.offsetWidth||1,d=null;lsC.z=1;lsC.x=0;lsC.y=0;lsC.fw=f.offsetWidth;lsC.fh=f.offsetHeight;lsCropDraw();
 f.onpointerdown=e=>{d={x:e.clientX,y:e.clientY,ox:lsC.x,oy:lsC.y};try{f.setPointerCapture(e.pointerId)}catch(_){}};
 f.onpointermove=e=>{if(!d)return;lsC.x=d.ox+(e.clientX-d.x)/k;lsC.y=d.oy+(e.clientY-d.y)/k;lsCropDraw()};
 f.onpointerup=f.onpointercancel=()=>{d=null};
 $("#cropz",o).oninput=e=>{lsC.z=+e.target.value;lsCropDraw()};
 o.onclick=e=>{var c=e.target.dataset.c;if(c==="cancel"){lsRaw=null;o.remove()}else if(c==="save")lsCropSave(o)}}
function lsCropSave(o){try{var im=lsRaw,s=lsC.s,W=480,H=Math.round(W*lsC.fh/lsC.fw),c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d"),sw=lsC.fw/s,sh=lsC.fh/s,sx=(im.width*s/2-lsC.fw/2-lsC.x)/s,sy=(im.height*s/2-lsC.fh/2-lsC.y)/s;x.drawImage(im,sx,sy,sw,sh,0,0,W,H);S.lsImg=c.toDataURL("image/jpeg",.85);S.lsOn=1;try{save()}catch(_){toast("Image is too large to save")}o.remove();lsRaw=null;paint()}catch(_){toast("Could not process image")}}
document.addEventListener("change",e=>{if(e.target.id==="lsfile"){lsOpen(e.target.files&&e.target.files[0]);e.target.value=""}});
$("#demoToggle").onclick=()=>$("#demo").classList.toggle("open");
function demo(k){
 if(k==="theme"){const dark=document.documentElement.dataset.theme==="light";S.dark=dark?"dark":"light";document.documentElement.dataset.theme=S.dark;save()}
 else if(k==="ff"){S.off+=10;save();paint();toast("Fast-forwarded 10 minutes")}
 else if(k==="dns"){S.strictDns=S.strictDns?0:1;save();paint()}
 else if(k==="overlay-app"){const a=Native.lockedApps()[0];a?overlay(a.label,a.until,false):toast("Lock an app first, then try again")}
 else if(k==="overlay-web"){const d=Native.domains().find(x=>x.until>now());d?overlay(d.domain,d.until,true):toast("Block a website first, then try again")}
 else if(k==="first"){PERMS.forEach(p=>S.perms[p.id]=0);S.owner=0;save();firstRun=true;stack=[{name:"perms",st:{}}];mount(true)}
 else if(k==="reset"){const th=S.dark;S=fresh();S.dark=th;save();firstRun=false;stack=[{name:"home",st:{}}];mount(true)}
 $("#demo").classList.remove("open")}

if(S.dark)document.documentElement.dataset.theme=S.dark;
firstRun=!PERMS.filter(p=>p.req).every(p=>S.perms[p.id]);
stack=[{name:firstRun?"perms":"home",st:{}}];mount(false);
</script>
</body>
